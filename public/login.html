<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubTrack — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060912;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --accent: #6ee7f7;
    --accent2: #818cf8;
    --text: #f1f5f9;
    --muted: #64748b;
    --error: #f87171;
    --success: #34d399;
    --input-bg: rgba(255,255,255,0.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -20%; right: -10%;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(129,140,248,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%; left: -10%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(110,231,247,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 44px 40px;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(20px);
    position: relative;
    z-index: 10;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .logo-text {
    font-size: 1.3rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }

  .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 30px; }

  .form-group {
    margin-bottom: 18px;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .form-group:nth-child(1) { animation-delay: 0.05s; }
  .form-group:nth-child(2) { animation-delay: 0.1s; }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .input-wrap { position: relative; }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.5;
  }

  input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 13px 14px 13px 40px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.93rem;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
    background: rgba(110,231,247,0.05);
  }

  input.error { border-color: var(--error); }

  .error-banner {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.25);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.82rem;
    color: var(--error);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 16px;
    display: none;
    animation: shake 0.3s ease;
  }

  .error-banner.show { display: flex; align-items: center; gap: 8px; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #060912;
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
    letter-spacing: 0.3px;
  }

  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .divider {
    border: none;
    border-top: 1px solid var(--glass-border);
    margin: 24px 0;
  }

  .register-link {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .register-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
  }

  /* Demo hint */
  .demo-hint {
    background: rgba(110,231,247,0.05);
    border: 1px solid rgba(110,231,247,0.15);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🔔</div>
    <div class="logo-text">SubTrack</div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to manage your subscriptions</p>

  <div class="error-banner" id="errorBanner">⚠️ <span id="errorMsg">Invalid credentials</span></div>

  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <span class="input-icon">✉️</span>
      <input type="email" id="email" placeholder="john@example.com" onkeydown="if(event.key==='Enter') login()">
    </div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter') login()">
    </div>
  </div>

  <button class="btn" onclick="login()">Sign In →</button>

  <hr class="divider">
  <div class="register-link">Don't have an account? <a href="/register.html">Sign up free</a></div>

  <div class="demo-hint">
    💡 First time? Register an account at register.html, then come back here to login.
  </div>
</div>

<script>
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  if (data.error) return alert(data.error);

  localStorage.setItem('subtrack_session', JSON.stringify(data.user));
  window.location.href = '/home.html';
}
</script>
</body>
</html>
